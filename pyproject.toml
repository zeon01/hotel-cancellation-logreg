[project]
name = "cancellation-logreg"
version = "0.1.0"
description = "Calibrated logistic regression for hotel cancellation prediction, framed for OTA Supply Operations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Saad Sharif Ahmed" }]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "category-encoders>=2.6",
    "imbalanced-learn>=0.12",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "kaggle>=1.6",
    "requests>=2.32",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "jupyter>=1.0",
    "jupytext>=1.16",
    "nbstripout>=0.7",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cancellation_logreg"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "SIM", "PD", "RUF"]
ignore = [
    "E501",  # line length already enforced by formatter
    "N802",  # sklearn/statsmodels conventions allow upper-case function names (e.g. tune_C)
    "N803",  # sklearn/statsmodels conventions: X is the feature matrix; C is regularisation
    "N806",  # sklearn/statsmodels: allow X, X_train, X_test in function bodies
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402", "F401", "F811"]
"tests/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.jupytext]
formats = "ipynb,py:percent"
